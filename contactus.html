<body>
    <!--menu-->
    <header class="cmenu">
        <nav id="nav-placeholder"></nav>
    </header>
    <!--menu-->
    <div class="main-contact">
        <div class="main-container page-contactus">
            <section class="container margin-m-100 ">
                <div class="row animate" data-anim-type="fadeIn" data-anim-delay="400">
                    <div class="col-md-6 contactus_form animate p-5" data-anim-type="fadeInLeft" data-anim-delay="400">
                        <h2 class="mb-4">联系我们</h2>
                        <form action="https://getform.io/f/c7a6c79c-a892-4bf7-9a2d-7af359f23288" method="POST">
                            <h6 class="font-weight-bold">询问</h6>
                            <div class="form-check">
                                <input type="hidden" name="productlist" value="no">
                                <input class="form-check-input" type="checkbox" name="productlist" value="yes" id="productlist">
                                <label class="form-check-label" for="productlist">
                                    产品目录
                                </label>
                            </div>
                            <div class="form-check">
                                <input type="hidden" name="price" value="no">
                                <input class="form-check-input" type="checkbox" name="price" value="yes" id="price">
                                <label class="form-check-label" for="price">
                                    价目表
                                </label>
                            </div>
                            <div class="form-check">
                                <input type="hidden" name="bimcad" value="no">
                                <input class="form-check-input" type="checkbox" name="bimcad" value="yes" id="bimcad">
                                <label class="form-check-label" for="bimcad">
                                    BIM/CAD
                                </label>
                            </div>
                            <div class="form-check">
                                <input type="hidden" name="agent" value="no">
                                <input class="form-check-input" type="checkbox" name="retailer" value="yes" id="retailer">
                                <label class="form-check-label" for="retailer">
                                    零售商清单
                                </label>
                            </div>
                            <div class="form-check">
                                <input type="hidden" name="agent" value="no">
                                <input class="form-check-input" type="checkbox" name="agent" value="yes" id="agent">
                                <label class="form-check-label" for="agent">
                                    代理商联系方式
                                </label>
                            </div>
                            <div class="form-check">
                                <input type="hidden" name="other" value="no">
                                <input class="form-check-input" type="checkbox" name="other" value="yes" id="other">
                                <label class="form-check-label" for="other">
                                    其他
                                </label>
                            </div>
                            <div class="pd10">
                                <h6 class="font-weight-bold">您的信息</h6>
                                <div class="form-group row">
                                    <div class="col-6">
                                        <div class="input-group">
                                            <input type="text" class="form-control" name="姓名" placeholder="姓名" required>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="input-group">
                                            <input type="email" class="form-control" name="邮箱" placeholder="电子邮箱" required>
                                        </div>
                                    </div>

                                    <div class="input-group col-12">
                                        <input type="text" class="form-control" name="城市" placeholder="所在城市">
                                    </div>

                                    <div class="input-group col-12">
                                        <input type="text" class="form-control" name="主题" placeholder="主题">
                                    </div>

                                    <div class="input-group col-12 mb-2 mb-sm-0">
                                        <textarea class="form-control" name="信息" placeholder="输入您的需求" required></textarea>
                                    </div>
                                    <div class="form-group col-12">
                                        <!-- Replace data-sitekey with your own one, generated at https://www.google.com/recaptcha/admin -->
                                        
                                        <input type="hidden" id="captchaResponse" name="g-recaptcha-response">
                                        <!-- <div class="g-recaptcha"
                                            data-sitekey="6LfKURIUAAAAAO50vlwWZkyK_G2ywqE52NU7YO0S"></div> -->
                                    </div>

                                    <div class="about-text col-12">
                                        <button class="btn main-btn col-md-4" type="submit"> 发送 </button>
                                    </div>
                                </div>

                                <!-- <select class="custom-select">
                            <option selected>职业</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                          </select> -->
                                <!-- <div class="form-group">
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="所在城市">
                            </div>
                        
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="主题">
                            </div>
                        
                            <div class="input-group mb-2 mb-sm-0">
                                <textarea class="form-control" placeholder="输入您的需求"></textarea>
                            </div>
                        </div> -->


                            </div>
                        </form>
                    </div>
                    <div class="col-md-6 cont-map animate " data-anim-type="fadeInRight" data-anim-delay="400">
                        <iframe src="https://ditu.amap.com/place/B0FFGF8BM8"></iframe>
                    </div>
                </div>

        </div>
    </div>
    <!--Scrolling text-->

        <article>
            <p class="example-left">CONTACT US / CONTACT US / CONTACT US / CONTACT US / CONTACT US</p>

        <article>
            <p class="example-right">CONTACT US / CONTACT US / CONTACT US / CONTACT US / CONTACT US</p>

        </article>
    </div>
